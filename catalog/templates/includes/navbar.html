<header>
    <div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow justify-content-between">
        <a href="{% url 'catalog:home' %}" class="my-0 mr-md-auto font-weight-normal navbar-brand text-decoration-none">
            <h5>Skystore</h5>
        </a>
        <nav class="d-flex align-items-center gap-2">
            <a class="btn btn-outline-primary {% if request.resolver_match.url_name == 'home' %}active{% endif %}"
               href="{% url 'catalog:home' %}">
                Главная
            </a>
            <a class="btn btn-outline-primary {% if request.resolver_match.url_name == 'catalog' %}active{% endif %}"
               href="{% url 'catalog:catalog' %}">
                Каталог
            </a>
            <a class="btn btn-outline-primary {% if request.resolver_match.url_name == 'contacts' %}active{% endif %}"
               href="{% url 'catalog:contacts' %}">
                Контакты
            </a>
            <a class="btn btn-outline-primary {% if 'blog' in request.path %}active{% endif %}"
               href="{% url 'blog:blog_list' %}">Блог</a>
            <a class="btn btn-outline-success {% if request.resolver_match.url_name == 'add_product' %}active{% endif %}"
               href="{% url 'catalog:add_product' %}">
                <i class="bi bi-plus-square"></i> Добавить товар
            </a>
        </nav>
        <div class="d-flex align-items-center gap-2">
            {% if user.is_authenticated %}
            <span class="text-dark fw-bold me-2">
                <i class="bi bi-person-circle"></i> {{ user.email }}
            </span>
            <a class="btn btn-outline-info" href="{% url 'users:profile' %}">Профиль</a>
            <form action="{% url 'users:logout' %}" method="post" style="display: inline;">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-danger">Выйти</button>
            </form>
            {% else %}
            <a class="btn btn-outline-success" href="{% url 'users:login' %}">Войти</a>
            <a class="btn btn-outline-primary" href="{% url 'users:register' %}">Регистрация</a>
            {% endif %}
        </div>
    </div>
</header>
